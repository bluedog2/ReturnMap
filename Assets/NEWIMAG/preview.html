<!doctype html><html lang="ko"><meta charset="utf-8"><title>Re:Trap · NEWIMAG</title>
<style>body{margin:32px;background:#11121c;color:#eee;font-family:system-ui}h1{color:#eac78c}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px}article{background:#202333;border:1px solid #45475a;padding:20px;border-radius:12px}img{display:block;width:256px;height:256px;object-fit:contain;image-rendering:pixelated;background:conic-gradient(#252839 25%,#303449 0 50%,#252839 0 75%,#303449 0) 0 0/24px 24px}select,button,input{margin:8px 8px 8px 0;padding:8px;background:#35394e;color:#fff;border:1px solid #687089;border-radius:5px}p{color:#b9bfd1}a{color:#eac78c}</style>
<h1>Re:Trap · NEWIMAG 초기 버전</h1><p><a href="preview-v2.html">최신 8프레임 버전 · 함정 · 이펙트 미리보기 열기</a></p><p>영주와 마왕군 · 동작 선택 / 좌우 반전 / 재생 속도 조절</p><main></main>
<script src="manifest.js"></script><script>
const labels={Idle:'대기',Run:'달리기 / 비행',Jump_Start:'점프 상승',Jump_Loop:'낙하',Land:'착지',Dash:'대시',Lord_Hit:'피격',Hit:'피격',Death:'사망'};
for(const ch of SPRITES.characters){const card=document.createElement('article');card.innerHTML=`<h2>${ch.name}</h2><img><select>${ch.animations.map((a,i)=>`<option value="${i}">${labels[a.state]||a.state}</option>`).join('')}</select><button>좌우 반전</button><br><label>속도 <input type="range" min="0.25" max="2" step="0.25" value="1"></label><p>동작당 4프레임 · 투명 PNG</p><a href="${ch.sheet}">전체 시트 열기</a>`;document.querySelector('main').append(card);const img=card.querySelector('img'),sel=card.querySelector('select'),speed=card.querySelector('input');let frame=0,last=0;card.querySelector('button').onclick=()=>img.style.transform=img.style.transform?'':'scaleX(-1)';sel.onchange=()=>{frame=0;last=0};function tick(t){const a=ch.animations[+sel.value];if(t-last>1000/(a.fps*+speed.value)){img.src=a.frames[frame];frame=(frame+1)%4;last=t}requestAnimationFrame(tick)}requestAnimationFrame(tick)}
</script></html>
