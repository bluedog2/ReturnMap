<!doctype html><html lang="ko"><meta charset="utf-8"><title>Re:Trap NEWIMAG V2</title><style>
body{margin:28px;background:#11121c;color:#eee;font:15px system-ui}h1{color:#eac78c}h2{margin-top:36px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}article{padding:18px;background:#202333;border:1px solid #42485c;border-radius:10px}img{display:block;width:256px;height:256px;object-fit:contain;image-rendering:pixelated;background:conic-gradient(#26293b 25%,#31374a 0 50%,#26293b 0 75%,#31374a 0) 0 0/24px 24px}select,button,input{padding:6px;margin:8px 6px 8px 0;background:#363b51;color:#fff;border:1px solid #626b83;border-radius:5px}a{color:#eac78c}p{color:#b7bfd0}</style>
<h1>Re:Trap · NEWIMAG V2</h1><p><a href="Tiles/preview.html">타일 미리보기 열기</a></p><p>8프레임 캐릭터 동작 · 무기 포함 · 함정 부품 · 별도 이펙트</p>
<h2>주인공과 몬스터</h2><div class="grid" id="characters"></div><h2>이펙트</h2><div class="grid" id="effects"></div><h2>함정 부품</h2><div class="grid" id="traps"></div>
<script src="AnimationV2/manifest.js"></script><script src="replacement-manifest.js"></script><script>
const names={Idle:'대기',Run:'달리기 / 비행',Jump_Start:'점프 상승',Jump_Loop:'낙하',Land:'착지',Dash:'대시',Hit:'피격',Death:'사망 / 소멸',Respawn:'부활'};
function animated(parent,title,animations,prefix){const card=document.createElement('article');card.innerHTML=`<h3>${title}</h3><img><select>${animations.map((a,i)=>`<option value="${i}">${names[a.state]||a.state}</option>`).join('')}</select><button>좌우 반전</button><label>속도 <input type="range" min="0.25" max="2" step="0.25" value="1"></label><p></p>`;parent.append(card);const img=card.querySelector('img'),sel=card.querySelector('select'),speed=card.querySelector('input'),p=card.querySelector('p');let frame=0,last=0;card.querySelector('button').onclick=()=>img.style.transform=img.style.transform?'':'scaleX(-1)';sel.onchange=()=>{frame=0;last=0};function tick(t){const a=animations[+sel.value];if(t-last>1000/(a.fps*+speed.value)){img.src=prefix+a.frames[frame];frame=(frame+1)%a.frames.length;last=t;p.textContent=`${a.frames.length}프레임 · ${a.fps} FPS · 미리보기 반복 재생`}requestAnimationFrame(tick)}requestAnimationFrame(tick)}
for(const c of ANIMATION_V2.characters)animated(document.querySelector('#characters'),c.name,c.animations,'AnimationV2/');
for(const e of REPLACEMENTS.effects)animated(document.querySelector('#effects'),names[e.state],[e],'');
for(const trap of REPLACEMENTS.traps){const card=document.createElement('article');card.innerHTML=`<h3>${{spike:'가시',arrow_shooter:'화살 발사대',drop_hammer:'낙하 해머'}[trap.id]}</h3><img><select>${trap.parts.map((p,i)=>`<option value="${i}">${p.state} · ${p.part}</option>`).join('')}</select><p>상태별 독립 부품 PNG</p>`;document.querySelector('#traps').append(card);const select=card.querySelector('select'),img=card.querySelector('img');select.onchange=()=>img.src=trap.parts[+select.value].file;select.onchange()}
</script></html>
