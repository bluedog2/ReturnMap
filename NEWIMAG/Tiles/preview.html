<!doctype html><html lang="ko"><meta charset="utf-8"><title>Re:Trap · Tile redraw</title><style>body{margin:28px;background:#151721;color:#e9e3d7;font:15px system-ui}h1{color:#e5c890}button,select{padding:9px;background:#30364a;color:#fff;border:1px solid #62687c;border-radius:5px;margin-right:8px}main{display:grid;grid-template-columns:repeat(2,minmax(300px,1fr));gap:18px;margin-top:20px}article{background:#222634;padding:16px;border-radius:10px}img{width:100%;image-rendering:pixelated;display:block}p{color:#b5bdcc}a{color:#e5c890}#tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:20px}#tiles a{font-size:11px;text-align:center;text-decoration:none}#tiles img{width:84px;height:84px;margin:auto;background:#30354b}</style>
<h1>Re:Trap · 타일 톤 맞춤</h1><p>빌드: 따뜻한 석재와 황동 / 플레이: 청회색 석재와 보라색 마기 · 원본 크기42×42 유지</p><select id="set"></select><button id="grid">비교 영역 강조</button><main><article><h2>기존 타일</h2><img id="old"></article><article><h2>새 타일</h2><img id="new"></article></main><p><a href="Replacement/Environment/CorruptedCastleTile.png">별도 CorruptedCastleTile 교체본 보기</a> · 개별 타일을 누르면 PNG를 엽니다.</p><div id="tiles"></div>
<script src="manifest.js"></script><script>const sel=document.querySelector('#set');for(const [i,s]of TILE_PACK.sets.entries()){const o=document.createElement('option');o.value=i;o.textContent=(s.phase==='BuildPhase'?'빌드':'플레이')+' · 챕터'+s.chapter.slice(-1);sel.append(o)}let grid=false;document.querySelector('#grid').onclick=()=>{grid=!grid;document.querySelectorAll('main img').forEach(i=>i.style.outline=grid?'1px solid #aa8':'');document.querySelectorAll('main article').forEach(a=>a.style.background=grid?'#30364a':'#222634')};sel.onchange=()=>{const s=TILE_PACK.sets[+sel.value];document.querySelector('#old').src=s.original;document.querySelector('#new').src=s.atlas;const tiles=document.querySelector('#tiles');tiles.replaceChildren();for(const f of TILE_PACK.files.filter(f=>f.original.includes('/'+s.phase+'/'+s.chapter+'/'))){const a=document.createElement('a');a.href=f.replacement;const img=document.createElement('img');img.src=f.replacement;a.append(img,document.createTextNode('r'+String(f.row).padStart(2,'0')+'_c'+String(f.col).padStart(2,'0')));tiles.append(a)}};sel.onchange();</script></html>
